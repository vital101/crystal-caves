<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Crystal Caves Ep.1 — WASM Playable</title>
<style>
  body { background:#111; color:#eee; font-family:monospace; margin:20px; text-align:center; }
  canvas { image-rendering:pixelated; background:#000; border:2px solid #444; display:block; margin:0 auto; }
  #hud { margin-top:10px; font-size:16px; }
  #msg { margin-top:6px; color:#ff6; font-weight:bold; }
  #diag { margin-top:6px; color:#0f0; font-family:monospace; font-size:11px; word-break:break-all; }
  button { font:inherit; margin:0 4px; }
  #legend { margin-top:8px; }
</style>
</head>
<body>
<h2>Crystal Caves Ep.1 — WASM Playable (dev)</h2>
<p><a href="game.html" style="color:#8cf">Full shell (title/menus/HUD/save) →</a></p>
<canvas id="game" width="320" height="200" style="width:960px;height:600px"></canvas>
<div id="hud">Level: <input id="levelNum" type="number" min="0" max="18" value="2" style="width:4em"> <button id="loadLevel">Load</button> <span id="lvl"></span></div>
<div id="msg"></div>
<div id="diag">initializing...</div>
<button id="render">Reload Level</button>
<button id="run">Pause</button>
<button id="step">Step Frame</button>
<div id="legend"></div>
<script src="keymap.js"></script>
<script src="legend.js"></script>
<script>
(async () => {
  const W = 320, H = 200;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const msg = document.getElementById('msg');
  const lvlEl = document.getElementById('lvl');
  const diag = document.getElementById('diag');

  const wasm = await fetch('render.wasm?v=' + Date.now()).then(r => r.arrayBuffer());
  const gfx = await fetch('assets/gfx.bin?v=' + Date.now()).then(r => r.arrayBuffer());
  const levels = await fetch('assets/levels.bin?v=' + Date.now()).then(r => r.arrayBuffer());
  const cells = await fetch('assets/cells.bin?v=' + Date.now()).then(r => r.arrayBuffer());
  const overlay = await fetch('assets/level_overlay.bin?v=' + Date.now()).then(r => r.arrayBuffer());
  const pal = await fetch('assets/palette.json?v=' + Date.now()).then(r => r.json());

  const { instance } = await WebAssembly.instantiate(wasm, {});
  const e = instance.exports;
  const mem = () => new Uint8Array(e.memory.buffer);

  const copyIn = (buf) => {
    const p = e.cc_alloc(buf.length);
    mem().set(new Uint8Array(buf), p);
    return p;
  };
  const gfxP = copyIn(gfx);
  const levelsP = copyIn(levels);
  const cellsP = copyIn(cells);
  const palP = e.cc_alloc(64);
  const palU32 = new Uint32Array(e.memory.buffer, palP, 16);
  pal.colors.forEach(([r, g, b], i) => { palU32[i] = (r << 16) | (g << 8) | b; });
  e.cc_set_assets(gfxP, levelsP);
  e.cc_set_cells(cellsP);
  const ovP = e.cc_alloc(overlay.byteLength);
  new Uint8Array(e.memory.buffer, ovP, overlay.byteLength).set(new Uint8Array(overlay));
  e.cc_set_level_overlay(ovP);
  e.cc_set_palette(palP);

  e.cc_shell_init();
  /* Dev page: the shell's fixed keys (help/pause) do not apply here. */
  CCLegend.render(document.getElementById('legend'), {
    keyForAction: (action) => e.cc_shell_key_for_action(action),
    actionForScan: (scan) => e.cc_shell_action_for_scan(scan),
    fixed: []
  });
  window.addEventListener('keydown', (ev) => {
    const scan = CCKeymap.scanFromEvent(ev);
    if (scan) { ev.preventDefault(); e.cc_input_scan(scan, 1); }
  });
  window.addEventListener('keyup', (ev) => {
    const scan = CCKeymap.scanFromEvent(ev);
    if (scan) { ev.preventDefault(); e.cc_input_scan(scan, 0); }
  });

  let level = 2;
  e.cc_objects_init(level);
  lvlEl.textContent = level === 2 ? "2 (Main Mineshaft)" : String(level);

  function renderFrame() {
    const camX = e.cc_cam_x(), camY = e.cc_cam_y();
    e.cc_render_view_cells(level, camX, camY);

    /* Draw active objects on top of the 320x200 viewport. */
    for (let s = 0; s < e.cc_obj_count(); s++) {
      if (e.cc_obj_state(s) === 2 || e.cc_obj_kind(s) === 0) continue;
      const blk = e.cc_obj_tile(s);
      const sh = e.cc_obj_draw_shape(s);
      if (!blk || !sh) continue;
      const ox = e.cc_obj_x(s) - camX;
      const oy = e.cc_obj_y(s) - camY;
      e.cc_draw_object_view(blk, sh, ox, oy);
    }

    const fb = e.cc_view_framebuffer();
    const img = new ImageData(new Uint8ClampedArray(e.memory.buffer, fb, W * H * 4), W, H);
    ctx.putImageData(img, 0, 0);

    /* Diagnostics. */
    const u8 = new Uint8Array(e.memory.buffer, fb, W * H * 4);
    let row0black = true;
    for (let x = 0; x < W; x++) {
      const i = x * 4;
      if (u8[i] || u8[i+1] || u8[i+2]) { row0black = false; break; }
    }
    let row16nonblack = 0;
    for (let x = 0; x < W; x++) {
      const i = 16 * W * 4 + x * 4;
      if (u8[i] || u8[i+1] || u8[i+2]) row16nonblack++;
    }
    const r16 = [];
    for (let x = 0; x < W; x += 80) {
      const i = 16 * W * 4 + x * 4;
      r16.push(`x${x}=(${u8[i]},${u8[i+1]},${u8[i+2]})`);
    }
    diag.textContent = `level=${level} cam=(${camX},${camY}) fb=0x${fb.toString(16)} row0black=${row0black} row16nonblack=${row16nonblack}/${W}`;
    console.log('DIAG:', diag.textContent, 'row16:', r16.join(' '));
  }

  function loadLevel(n) {
    level = Math.max(0, Math.min(18, n | 0));
    document.getElementById('levelNum').value = level;
    e.cc_objects_init(level);
    lvlEl.textContent = level === 2 ? "2 (Main Mineshaft)" : String(level);
    renderFrame();
  }
  document.getElementById('render').addEventListener('click', () => loadLevel(level));
  document.getElementById('loadLevel').addEventListener('click', () => {
    loadLevel(parseInt(document.getElementById('levelNum').value, 10) || 0);
  });

  let running = true;
  const runBtn = document.getElementById('run');
  runBtn.addEventListener('click', () => {
    running = !running;
    runBtn.textContent = running ? 'Pause' : 'Run';
  });
  document.getElementById('step').addEventListener('click', () => {
    e.cc_objects_step_full();
    e.cc_player_draw_sound();
    e.cc_hud_tick();
    renderFrame();
  });

  /* Original timing: PIT divisor 0x2147 (~140.06 Hz), 8 ticks per frame. */
  const STEP_MS = 1000 * 8 * 0x2147 / 1193182;
  let last = 0, accum = 0;
  function frameLoop(now) {
    if (!last) last = now;
    let dt = now - last;
    last = now;
    if (dt > 250) dt = 250;
    if (running) {
      accum += dt;
      let steps = 0;
      while (accum >= STEP_MS && steps < 4) {
        e.cc_objects_step_full();
        e.cc_player_draw_sound();
        e.cc_hud_tick();
        accum -= STEP_MS;
        steps++;
      }
      if (steps) renderFrame();
    } else {
      accum = 0;
    }
    requestAnimationFrame(frameLoop);
  }
  requestAnimationFrame(frameLoop);

  // Initial render
  renderFrame();
})();
</script>
</body>
</html>
