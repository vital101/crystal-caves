<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Crystal Caves Ep.1</title>
<style>
  html,body { margin:0; background:#111; color:#ddd; font-family:monospace; }
  #wrap { display:flex; flex-direction:column; align-items:center; padding:12px; }
  canvas { image-rendering:pixelated; width:960px; height:600px; background:#000;
           border:1px solid #444; }
  #bar { margin-top:10px; width:100%; max-width:960px; }
  #diag { margin-top:6px; font-size:11px; color:#777; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="320" height="200"></canvas>
  <div id="bar">
    <div id="legend"></div>
  </div>
  <div id="diag">loading...</div>
</div>
<script src="keymap.js"></script>
<script src="legend.js"></script>
<script src="persist.js"></script>
<script src="sound_synth.js"></script>
<script src="audio.js"></script>
<script>
(() => {
  const W = 320, H = 200;
  const TEST_MODE = new URLSearchParams(location.search).has('test');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const diag = document.getElementById('diag');
  const legend = document.getElementById('legend');

  const KEY = {
    BACKSPACE: 8, ENTER: 13, ESC: 27, SPACE: 32, F1: 0x13B,
  };
  const STEP_MS = 1000 * 8 * 0x2147 / 1193182;
  const TICK_MS = 1000 / 140.06;

  /* DOS binds jump to Ctrl, but on macOS Ctrl+Arrow is the Spaces shortcut,
   * so an arrow pressed while jump is held never reaches the page.  Space
   * and Up also jump unless the player bound them to another action. */
  const JUMP_ALIAS_SCANS = [0x39, 0x48];   /* Space, Up arrow */

  (async () => {
    const load = (p) => fetch(p + '?v=' + Date.now()).then(r => r.arrayBuffer());
    const [wasm, gfx, levels, cells, overlay, screens, f1, f2, spl, pal, snd] =
      await Promise.all([
        load('render.wasm'), load('assets/gfx.bin'), load('assets/levels.bin'),
        load('assets/cells.bin'), load('assets/level_overlay.bin'),
        load('assets/screens.bin'), load('assets/mni_f1.bin'),
        load('assets/mni_f2.bin'), load('assets/mni_spl.bin'),
        fetch('assets/palette.json').then(r => r.json()),
        fetch('assets/sound.json').then(r => r.json()),
      ]);

    const { instance } = await WebAssembly.instantiate(wasm, {});
    const e = instance.exports;
    const mem = () => new Uint8Array(e.memory.buffer);

    const audio = new CCAudio();
    audio.load(snd);
    audio.onended = (id) => e.cc_sound_end(id);
    const copyIn = (buf) => {
      const p = e.cc_alloc(buf.byteLength);
      mem().set(new Uint8Array(buf), p);
      return p;
    };
    const copyString = (s) => {
      const bytes = new TextEncoder().encode(s);
      const p = e.cc_alloc(bytes.length + 1);
      const m = mem();
      m.set(bytes, p);
      m[p + bytes.length] = 0;
      return p;
    };

    e.cc_set_assets(copyIn(gfx), copyIn(levels));
    e.cc_set_cells(copyIn(cells));
    const ovp = e.cc_alloc(overlay.byteLength);
    mem().set(new Uint8Array(overlay), ovp);
    e.cc_set_level_overlay(ovp);
    e.cc_set_screens(copyIn(screens));
    e.cc_text_set_fonts(copyIn(f1), copyIn(f2), copyIn(spl));

    const palP = e.cc_alloc(64);
    const pal32 = new Uint32Array(e.memory.buffer, palP, 16);
    pal.colors.forEach(([r, g, b], i) => { pal32[i] = (r << 16) | (g << 8) | b; });
    e.cc_set_palette(palP);

    const stateSize = e.cc_state_size();
    const stateP = e.cc_alloc(stateSize);

    // ---- persistent config / high scores -------------------------------
    e.cc_sound_init();
    e.cc_shell_init();
    const cfg = CCPersist.loadConfig(localStorage);
    e.cc_shell_set_config(cfg.sound, cfg.joystick, cfg.video);
    for (let i = 0; i < 4; i++) e.cc_shell_set_key(i, cfg.keys[i]);
    audio.setEnabled(cfg.sound);
    CCPersist.loadHighScores(localStorage, e, copyString);
    CCPersist.saveConfig(localStorage, cfg);

    /* The four action keys are redefinable from the help screen, so the
     * legend is rebuilt from the live bindings instead of listing them. */
    function renderLegend() {
      CCLegend.render(legend, {
        keyForAction: (action) => e.cc_shell_key_for_action(action),
        actionForScan: (scan) => e.cc_shell_action_for_scan(scan),
        jumpAliases: JUMP_ALIAS_SCANS,
        note: 'Click the game once to enable sound; every control is on the keyboard.'
      });
    }
    renderLegend();

    function persistConfig() {
      const c = {
        version: 2,
        sound: e.cc_shell_sound_on(),
        joystick: e.cc_shell_joystick_on(),
        video: e.cc_shell_video_alt(),
        keys: [0, 1, 2, 3].map(i => e.cc_shell_key_for_action(i))
      };
      audio.setEnabled(c.sound);
      CCPersist.saveConfig(localStorage, c);
      renderLegend();
    }
    function persistHighScores() {
      CCPersist.saveHighScores(localStorage, e);
    }

    // ---- rendering ------------------------------------------------------
    function present() {
      const fb = e.cc_view_framebuffer();
      const img = new ImageData(new Uint8ClampedArray(e.memory.buffer, fb, W * H * 4), W, H);
      ctx.putImageData(img, 0, 0);
    }
    function renderGame() {
      const level = e.cc_cur_level();
      const camX = e.cc_cam_x(), camY = e.cc_cam_y();
      e.cc_render_view_cells(level, camX, camY);
      for (let s = 0; s < e.cc_obj_count(); s++) {
        if (e.cc_obj_state(s) === 2 || e.cc_obj_kind(s) === 0) continue;
        const blk = e.cc_obj_tile(s);
        const sh = e.cc_obj_draw_shape(s);
        if (!blk || !sh) continue;
        e.cc_draw_object_view(blk, sh, e.cc_obj_x(s) - camX, e.cc_obj_y(s) - camY);
      }
      if (e.cc_shell_hud_active()) e.cc_hud_render_screen();
      if (e.cc_shell_overlay()) e.cc_shell_render();
      present();
    }
    function renderShell() {
      e.cc_shell_render();
      present();
    }
    function render() {
      if (e.cc_shell_state() === 4 || e.cc_shell_overlay()) renderGame();
      else renderShell();
    }

    // ---- save/restore handshake ----------------------------------------
    function handleRequest() {
      if (!e.cc_shell_request_pending()) return;
      const kind = e.cc_shell_request_kind();
      const slot = e.cc_shell_request_slot();
      let ok = 0;
      if (kind === 1)
        ok = CCPersist.saveSlot(localStorage, slot, e, stateP, stateSize, mem) ? 1 : 0;
      else if (kind === 2)
        ok = CCPersist.loadSlot(localStorage, slot, e, stateP, stateSize, mem, true) ? 1 : 0;
      e.cc_shell_request_done(ok);
      if (kind === 2 && ok) renderLegend();
      render();
    }

    // ---- input ----------------------------------------------------------
    let running = true;
    function sendShellKey(ch) { e.cc_shell_key(ch); }

    const JUMP_FLAG = 0x338B;
    const JUMP_ACTION = 2;
    const jumpHeld = new Set();

    function isJumpScan(scan) {
      if (!scan) return false;
      if (scan === e.cc_shell_key_for_action(JUMP_ACTION)) return true;
      return JUMP_ALIAS_SCANS.includes(scan) &&
             e.cc_shell_action_for_scan(scan) < 0;
    }
    function setJumpSource(scan, down) {
      if (down) jumpHeld.add(scan);
      else jumpHeld.delete(scan);
      e.cc_input_set(JUMP_FLAG, jumpHeld.size ? 1 : 0);
    }
    function releaseJump() {
      jumpHeld.clear();
      e.cc_input_set(JUMP_FLAG, 0);
    }

    window.addEventListener('keydown', (ev) => {
      audio.unlock();
      const st = e.cc_shell_state();
      const scan = CCKeymap.scanFromEvent(ev);
      if (ev.key === 'F1') { ev.preventDefault(); sendShellKey(KEY.F1); return; }
      if (ev.key === 'Escape') { ev.preventDefault(); sendShellKey(KEY.ESC); return; }
      if (st === 16 || st === 17) { /* keyboard redefine / confirm */
        ev.preventDefault();
        e.cc_shell_key_scan(scan || (ev.key === ' ' ? 0x39 : 0));
        if (e.cc_shell_state() === 6) persistConfig();
        return;
      }
      if (st === 4) { /* game */
        if (ev.key === 'p' || ev.key === 'P') { e.cc_shell_key(112); return; }
        if (scan) {
          ev.preventDefault();
          if (isJumpScan(scan)) setJumpSource(scan, true);
          else e.cc_input_scan(scan, 1);
        }
        return;
      }
      if (st === 12) { /* name entry */
        if (ev.key === 'Enter') sendShellKey(KEY.ENTER);
        else if (ev.key === 'Backspace') sendShellKey(KEY.BACKSPACE);
        else if (ev.key === ' ') sendShellKey(KEY.SPACE);
        else sendShellKey(ev.key.length === 1 ? ev.key.charCodeAt(0) : 0);
      } else if (ev.key === 'Enter') {
        sendShellKey(KEY.ENTER);
      } else if (ev.key === 'Backspace') {
        sendShellKey(KEY.BACKSPACE);
      } else {
        const code = ev.key.length === 1 ? ev.key.charCodeAt(0) : 0;
        if (st === 3 || st === 14) sendShellKey(code || KEY.ENTER);
        else sendShellKey(code || (ev.key === ' ' ? KEY.ENTER : 0));
      }
      /* The original polls the live keyboard every frame, so an action key
       * pressed while a modal (pause/help/message) is up is already held
       * when play resumes.  Latch it here for every state that is not text
       * entry; the keyup handler below always releases it. */
      if (scan && st !== 12) {
        if (isJumpScan(scan)) setJumpSource(scan, true);
        else e.cc_input_scan(scan, 1);
      }
      if (e.cc_shell_state() === 11 || e.cc_shell_state() === 12) persistHighScores();
      if (e.cc_shell_config_dirty()) {
        persistConfig();
        e.cc_shell_config_clear_dirty();
      }
    });
    window.addEventListener('pointerdown', () => { audio.unlock(); });
    window.addEventListener('keyup', (ev) => {
      const scan = CCKeymap.scanFromEvent(ev);
      if (!scan) return;
      /* Always pass the release through, whatever the shell state: the
       * original polls the live keyboard, so a key released while a modal
       * is up is simply not held afterwards.  Dropping that release left
       * the direction latched -- after the "more crystals" exit message
       * Mylo stayed glued to the door, because the stuck direction and
       * the key pressed to walk away cancelled each other out. */
      if (e.cc_shell_state() === 4 || isJumpScan(scan) || jumpHeld.has(scan))
        ev.preventDefault();
      if (isJumpScan(scan) || jumpHeld.has(scan)) setJumpSource(scan, false);
      else e.cc_input_scan(scan, 0);
    });
    window.addEventListener('blur', () => {
      releaseJump();
      for (let i = 0; i < 4; i++)
        e.cc_input_scan(e.cc_shell_key_for_action(i), 0);
    });

    // ---- sound event pump ----------------------------------------------
    function pumpSound() {
      const n = e.cc_sound_event_count();
      for (let i = 0; i < n; i++) audio.play(e.cc_sound_event_at(i));
      if (n) e.cc_sound_event_clear();
      if (!e.cc_sound_playing()) audio.stop();
    }

    // ---- main loop ------------------------------------------------------
    let last = 0, accum = 0, soundAccum = 0;
    function frame(now) {
      if (!last) last = now;
      let dt = now - last; last = now;
      if (dt > 250) dt = 250;
      /* The original sound ISR runs on the same 140.06 Hz PIT as the game
       * timer, independently of the 17.5 Hz game frame. */
      soundAccum += dt;
      let soundTicks = Math.floor(soundAccum / TICK_MS);
      if (soundTicks > 32) soundTicks = 32;
      soundAccum -= soundTicks * TICK_MS;
      handleRequest();
      if (e.cc_shell_state() !== 4 && jumpHeld.size) releaseJump();
      if (e.cc_shell_state() === 4 && e.cc_shell_joystick_on() && navigator.getGamepads) {
        const pads = navigator.getGamepads();
        let gp = null;
        for (const p of pads) { if (p) { gp = p; break; } }
        if (gp) {
          const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
          e.cc_input_set(0x338E, ax < -0.4 ? 1 : 0);
          e.cc_input_set(0x338F, ax > 0.4 ? 1 : 0);
          e.cc_input_set(0x338B, (gp.buttons[0] && gp.buttons[0].pressed) || ay < -0.5 ? 1 : 0);
          e.cc_input_set(0x3390, gp.buttons[2] && gp.buttons[2].pressed ? 1 : 0);
        }
      }
      /* Advance the sound driver at 140.06 Hz.  In shell states the shell
       * timer advances on the same tick, after the sound tick, so a
       * wait-for-sound (ID 26) observes the cleared playing flag. */
      for (let i = 0; i < soundTicks; i++) {
        e.cc_sound_tick();
        if (e.cc_shell_state() !== 4) e.cc_shell_step_ticks(1);
      }

      if (e.cc_shell_state() === 4) {
        e.cc_shell_step();
        accum += dt;
        let steps = 0;
        while (accum >= STEP_MS && steps < 4) {
          e.cc_objects_step_full();
          e.cc_player_draw_sound();
          e.cc_hud_tick();
          e.cc_shell_step();
          accum -= STEP_MS;
          steps++;
          if (e.cc_shell_state() !== 4) break;
        }
        pumpSound();
        if (steps) renderGame();
      } else {
        pumpSound();
        if (e.cc_shell_overlay()) renderGame();
        else renderShell();
      }
      requestAnimationFrame(frame);
    }

    // ---- automated test hook (only with ?test=1) ------------------------
    /* The browser smoke test drives the game explicitly instead of waiting on
     * requestAnimationFrame: fixed inputs, fixed step counts, stable output.
     * Normal play never sees this object and keeps the rAF loop. */
    if (TEST_MODE) {
      const readStr = (p) => {
        const m = mem();
        let s = '';
        for (let i = 0; i < 64; i++) {
          const c = m[p + i];
          if (!c) break;
          s += String.fromCharCode(c);
        }
        return s;
      };
      const hashBytes = (u8) => {
        let h = 0x811c9dc5;
        for (let i = 0; i < u8.length; i++) {
          h ^= u8[i];
          h = Math.imul(h, 0x01000193);
        }
        return h >>> 0;
      };
      const fbHash = () => {
        const fb = e.cc_view_framebuffer();
        return hashBytes(new Uint8Array(e.memory.buffer, fb, W * H * 4));
      };
      const nonBlack = () => {
        const fb = e.cc_view_framebuffer();
        const u8 = new Uint8Array(e.memory.buffer, fb, W * H * 4);
        let n = 0;
        for (let i = 0; i < W * H; i++)
          if (u8[i * 4] || u8[i * 4 + 1] || u8[i * 4 + 2]) n++;
        return n;
      };
      const stateHash = () => {
        const n = e.cc_state_save(stateP, stateSize);
        if (!(n > 0)) return 0;
        return hashBytes(new Uint8Array(e.memory.buffer, stateP, n));
      };
      const step = (n) => {
        for (let i = 0; i < n; i++) {
          e.cc_objects_step_full();
          e.cc_player_draw_sound();
          e.cc_hud_tick();
          e.cc_shell_step();
        }
        render();
      };
      window.__cc = {
        ready: false,
        exports: e,
        state: () => e.cc_shell_state(),
        level: () => e.cc_cur_level(),
        player: () => [e.cc_player_x(), e.cc_player_y()],
        ammo: () => e.cc_ammo(),
        score: () => e.cc_score() >>> 0,
        hudActive: () => e.cc_shell_hud_active(),
        key: (k) => e.cc_shell_key(k),
        keyScan: (s) => e.cc_shell_key_scan(s),
        input: (scan, down) => e.cc_input_scan(scan, down),
        stepTicks: (n) => e.cc_shell_step_ticks(n),
        step,
        render,
        handleRequest,
        fbHash,
        nonBlack,
        stateHash,
        saveSlot: (slot) =>
          CCPersist.saveSlot(localStorage, slot, e, stateP, stateSize, mem),
        loadSlot: (slot, hubOnly) =>
          CCPersist.loadSlot(localStorage, slot, e, stateP, stateSize, mem,
                             hubOnly !== false),
        saveConfig: persistConfig,
        saveHighScores: persistHighScores,
        setConfig: (sound, joystick, video) =>
          e.cc_shell_set_config(sound, joystick, video),
        config: () => [e.cc_shell_sound_on(), e.cc_shell_joystick_on(),
                       e.cc_shell_video_alt()],
        addHiscore: (name, score) =>
          e.cc_shell_hiscore_add(copyString(name), score),
        hiscore: (i) => ({
          name: readStr(e.cc_shell_hiscore_name(i)),
          score: e.cc_shell_hiscore_score(i) >>> 0,
        }),
        storage: () => ({
          config: localStorage.getItem(CCPersist.CFG_KEY),
          hiscores: localStorage.getItem(CCPersist.HS_KEY),
          save0: localStorage.getItem(CCPersist.SAVE_PREFIX + '0'),
        }),
      };
      diag.textContent = 'test-ready';
      renderShell();
      window.__cc.ready = true;
      return;
    }

    diag.hidden = true;
    renderShell();
    requestAnimationFrame(frame);
  })().catch((err) => {
    diag.hidden = false;
    diag.textContent = 'error: ' + err.message;
    console.error(err);
  });
})();
</script>
</body>
</html>
