<style>
  html,body { margin:0; background:#111; color:#ddd; font-family:monospace; }
  body { overscroll-behavior:none; touch-action:manipulation; }
  #wrap { display:flex; flex-direction:column; align-items:center;
          padding:12px; min-height:100vh; min-height:100dvh;
          box-sizing:border-box; }
  #stage { position:relative; display:flex; align-items:center;
           justify-content:center; line-height:0; width:100%;
           max-width:min(960px, calc((100vh - 120px) * 1.6));
           aspect-ratio:16/10; }
  #stage canvas { image-rendering:pixelated; width:100%; height:100%;
                  background:#000; border:1px solid #444; }
  #stage:fullscreen, #stage:-webkit-full-screen {
    width:100vw; height:100vh; background:#000; max-width:none;
  }
  #stage:fullscreen canvas, #stage:-webkit-full-screen canvas {
    width:min(100vw, 160vh); height:min(100vh, 62.5vw); border:0;
  }
  #bar { margin-top:10px; width:100%; max-width:960px; }
  #tools { display:flex; justify-content:center; gap:8px; margin-bottom:8px;
           flex-wrap:wrap; }
  #fsBtn, #touchToggle { font:inherit; font-size:13px; color:#ddd;
           background:#262626; border:1px solid #5a5a5a;
           border-bottom-width:3px; border-radius:4px; padding:2px 12px 3px;
           cursor:pointer; }
  #fsBtn:hover, #touchToggle:hover { background:#333; }
  #fsBtn:disabled { opacity:.5; cursor:default; }
  #diag { margin-top:6px; font-size:11px; color:#777; }

  /* ---- touch controls -------------------------------------------------- */
  #touch-controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between; pointer-events:none;
    padding:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    box-sizing:border-box;
  }
  .touch-pad { display:flex; gap:8px; pointer-events:auto; }
  .touch-btn {
    width:56px; height:56px; border-radius:50%;
    background:rgba(0,0,0,0.55);
    border:2px solid rgba(255,255,255,0.55);
    color:rgba(255,255,255,0.92); font-size:20px;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .touch-btn.active {
    background:rgba(70,70,70,0.9);
    border-color:rgba(255,255,255,0.95);
  }
  #touch-controls[hidden], #touch-keys[hidden] { display:none; }
  #touch-keys {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:center; gap:4px; pointer-events:none;
    padding:4px; padding-top:calc(4px + env(safe-area-inset-top));
  }
  #touch-keys .touch-key {
    pointer-events:auto; min-width:40px; height:28px; border-radius:4px;
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.55);
    color:rgba(255,255,255,0.92); font-size:12px;
    touch-action:manipulation;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  #touch-keys .touch-key.active { background:rgba(70,70,70,0.9); }
  #touch-keyboard {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(20,20,20,0.95); border-top:1px solid #444;
    padding:4px; padding-bottom:calc(4px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(10, 1fr); gap:2px;
    z-index:20; transform:translateY(100%); pointer-events:none;
    transition:transform 0.2s ease;
  }
  #touch-keyboard.open { transform:translateY(0); pointer-events:auto; }
  #touch-keyboard button {
    height:36px; font:inherit; font-size:14px; background:#333; color:#ddd;
    border:1px solid #555; border-radius:4px; touch-action:manipulation;
  }

  /* ---- immersive (iOS fallback when the Fullscreen API is absent) ----- */
  body.immersive #bar, body.immersive #diag { display:none; }
  body.immersive #wrap { padding:0; }
  body.immersive #stage {
    max-width:none; width:100vw; height:100vh; height:100dvh;
  }
  body.immersive #stage canvas {
    width:min(100vw, 160vh); height:min(100vh, 62.5vw); border:0;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="320" height="200"></canvas>
    <div id="touch-controls" hidden>
      <div id="touch-pad-left" class="touch-pad">
        <button class="touch-btn" data-action="left" aria-label="Move left">◀</button>
        <button class="touch-btn" data-action="right" aria-label="Move right">▶</button>
      </div>
      <div id="touch-pad-right" class="touch-pad">
        <button class="touch-btn" data-action="jump" aria-label="Jump">▲</button>
        <button class="touch-btn" data-action="fire" aria-label="Fire">●</button>
      </div>
    </div>
    <div id="touch-keys" hidden>
      <button class="touch-key" data-key="27">Esc</button>
      <button class="touch-key" data-key="13">Enter</button>
      <button class="touch-key" data-key="315">Help</button>
      <button class="touch-key" data-key="112">Pause</button>
    </div>
  </div>
  <div id="bar">
    <div id="tools">
      <button id="fsBtn" type="button" aria-label="Toggle fullscreen">Fullscreen</button>
      <button id="touchToggle" type="button" aria-label="Toggle touch controls">Touch controls</button>
    </div>
    <div id="legend"></div>
  </div>
  <div id="diag">loading...</div>
</div>
<div id="touch-keyboard"></div>
<script src="keymap.js"></script>
<script src="legend.js"></script>
<script src="persist.js"></script>

<script src="game/input.js"></script>
<script src="game.js"></script>
</body>
