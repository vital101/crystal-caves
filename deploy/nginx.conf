# Static host for the wasm build.  On Dokku this container sits behind the
# host's nginx (TLS terminated there), so it only speaks plain HTTP on :80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    root /srv;
    index game.html;

    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/wasm application/json application/javascript
               text/css text/plain;

    # The shell page is reloaded to pick up a new deploy, so always revalidate.
    location = /game.html {
        add_header Cache-Control "no-cache";
    }

    # render.wasm and the asset tables are fetched with a cache-busting query
    # string and are immutable between deploys.
    location ~* \.(wasm|bin|json)$ {
        add_header Cache-Control "public, max-age=3600";
        default_type application/octet-stream;
        types {
            application/wasm wasm;
            application/octet-stream bin;
            application/json json;
        }
    }
}
