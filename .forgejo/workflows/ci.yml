name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      oracle_targets:
        description: 'Space-separated oracle make targets to regenerate'
        required: false
        type: string
        default: 'test-oracle-physics test-oracle-combat test-oracle-cells test-oracle-handlers test-oracle-loader test-oracle-caves'

# Forgejo-only: this file lives in .forgejo/workflows (GitHub never reads
# that directory, so nothing runs on github.com).  Actions are loaded from
# data.forgejo.org and referenced fully qualified, per the Forgejo docs.
# No `permissions:` block: Forgejo ignores it (capabilities are granted
# through Authorized Integrations) and these jobs only need the default
# read token.

jobs:
  deterministic:
    name: build + deterministic suite
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          if [ ! -x "$llvm_dir/wasm-ld" ]; then
            echo "wasm-ld not found in $llvm_dir" >&2
            exit 1
          fi
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"
          "$llvm_dir/clang" --version
          "$llvm_dir/wasm-ld" --version

      - name: Build
        run: make -C wasm clang LLVM="$LLVM"

      - name: Regression suite (committed fixtures)
        run: make -C wasm test-all LLVM="$LLVM"

      - name: Source-size guardrail
        run: make -C wasm lint-strict

      - name: wasm size and frame budget
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          size=$(stat -c%s wasm/render.wasm)
          echo "render.wasm: $size bytes" | tee -a "$summary"
          make -C wasm perf LLVM="$LLVM" | tee -a "$summary"

  browser:
    name: headless browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          if [ ! -x "$llvm_dir/wasm-ld" ]; then
            echo "wasm-ld not found in $llvm_dir" >&2
            exit 1
          fi
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wasm/package-lock.json

      - name: Install browser test dependencies
        working-directory: wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: make -C wasm test-browser LLVM="$LLVM"

  native:
    name: native build (${{ matrix.os }}) + digest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub-hosted images preinstall CMake, a C compiler, Python 3 and git;
      # self-hosted/act images (e.g. catthehacker/ubuntu) may not, so install
      # whatever is missing.  SDL3 is found via find_package when present,
      # otherwise CMake FetchContent builds it from source (see
      # native/CMakeLists.txt) — that needs git and a C compiler.
      - name: Ensure build tools (Linux images may lack them)
        if: runner.os == 'Linux'
        run: |
          missing=()
          command -v cmake   >/dev/null || missing+=(cmake)
          command -v cc      >/dev/null || missing+=(build-essential)
          command -v python3 >/dev/null || missing+=(python3)
          command -v git     >/dev/null || missing+=(git)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build native/build --config Release

      # Same golden-master SHA-256 fixture as the wasm digest test: each
      # scenario group runs in a fresh process and must hash identically.
      - name: Native digest vs wasm golden master
        shell: bash
        run: |
          mkdir -p native/build/digest
          for g in static_render gameplay transitions warp shell save_round_trip; do
            ./native/build/cc_digest "$g" "native/build/digest/$g.json" || exit 1
          done
          node native/compare_digests.js notes/refactor_digests.json native/build/digest/*.json

      - name: Headless host smoke (dummy video/audio)
        shell: bash
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./native/build/caves --smoke 120

      # Forgejo's fork of upload-artifact: the upstream v4 action refuses to
      # run against any server that is not github.com (GHESNotSupportedError).
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: caves-${{ matrix.os }}
          path: |
            native/build/caves
            native/build/caves.exe
          if-no-files-found: error

  oracle:
    name: oracle regeneration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"

      - uses: https://data.forgejo.org/actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install oracle dependencies
        run: pip install -r tools/requirements.txt

      - name: Regenerate and compare oracle fixtures
        run: make -C wasm ${{ inputs.oracle_targets }} LLVM="$LLVM"
