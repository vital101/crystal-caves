name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      oracle_targets:
        description: 'Space-separated oracle make targets to regenerate'
        required: false
        type: string
        default: 'test-oracle-physics test-oracle-combat test-oracle-cells test-oracle-handlers test-oracle-loader test-oracle-caves'

# Forgejo-only: this file lives in .forgejo/workflows (GitHub never reads
# that directory, so nothing runs on github.com).  Actions are loaded from
# data.forgejo.org and referenced fully qualified, per the Forgejo docs.
# No `permissions:` block: Forgejo ignores it (capabilities are granted
# through Authorized Integrations).  The release-asset uploads authenticate
# with the job's built-in token (secrets.GITHUB_TOKEN) — the same
# mechanism candid_app's release workflow uses; no extra secret is needed.

# Pushes to main and PRs run the fast test jobs.  Version tags (v1.0.0 or
# 1.0.0) additionally run the release builds: the native matrix
# (Ubuntu/Windows/macOS) compiles `caves`/`caves_ep2`/`caves_ep3`, runs the
# digests + smokes + launcher-menu and save-isolation checks and uploads
# per-OS artifacts, and a web-bundle job packages the complete
# three-episode site (`make -C wasm bundle-web`).  On tag builds each job
# also attaches its bundle to the release that carries the tag (a release
# created through the Forgejo interface, or a draft created on the fly
# for a plain git-pushed tag).

jobs:
  deterministic:
    name: build + deterministic suite
    runs-on: ubuntu-latest-amd64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          if [ ! -x "$llvm_dir/wasm-ld" ]; then
            echo "wasm-ld not found in $llvm_dir" >&2
            exit 1
          fi
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"
          "$llvm_dir/clang" --version
          "$llvm_dir/wasm-ld" --version

      - name: Build
        run: make -C wasm clang LLVM="$LLVM"

      - name: Regression suite (committed fixtures)
        run: make -C wasm test-all LLVM="$LLVM"

      - name: Source-size guardrail
        run: make -C wasm lint-strict

      - name: wasm size and frame budget
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          size=$(stat -c%s wasm/render.wasm)
          echo "render.wasm: $size bytes" | tee -a "$summary"
          make -C wasm perf LLVM="$LLVM" | tee -a "$summary"

  browser:
    name: headless browser smoke
    runs-on: ubuntu-latest-amd64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          if [ ! -x "$llvm_dir/wasm-ld" ]; then
            echo "wasm-ld not found in $llvm_dir" >&2
            exit 1
          fi
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wasm/package-lock.json

      - name: Install browser test dependencies
        working-directory: wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: make -C wasm test-browser LLVM="$LLVM"

  native:
    name: native build (${{ matrix.os }}) + digest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest-amd64, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub-hosted images preinstall CMake, a C compiler, Python 3 and git;
      # self-hosted/act images (e.g. catthehacker/ubuntu) may not, so install
      # whatever is missing.  SDL3 is found via find_package when present,
      # otherwise CMake FetchContent builds it from source (see
      # native/CMakeLists.txt) — that needs git and a C compiler.
      - name: Ensure build tools (Linux images may lack them)
        if: runner.os == 'Linux'
        run: |
          missing=()
          command -v cmake   >/dev/null || missing+=(cmake)
          command -v cc      >/dev/null || missing+=(build-essential)
          command -v python3 >/dev/null || missing+=(python3)
          command -v git     >/dev/null || missing+=(git)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      # All three episodes: the launcher (caves) plus the per-episode
      # binaries, and cc_digest for the golden-master step below.  The
      # committed generated data makes each build offline.
      - name: Build all episodes + digest harness
        run: cmake --build native/build --config Release --target cc_digest caves caves_ep2 caves_ep3 persist_test_ep1 persist_test_ep2 persist_test_ep3

      # Same golden-master SHA-256 fixture as the wasm digest test: each
      # scenario group runs in a fresh process and must hash identically.
      - name: Native digest vs wasm golden master
        shell: bash
        run: |
          mkdir -p native/build/digest
          for g in static_render gameplay transitions warp shell save_round_trip; do
            ./native/build/cc_digest "$g" "native/build/digest/$g.json" || exit 1
          done
          node native/compare_digests.js notes/refactor_digests.json native/build/digest/*.json

      - name: Headless host smoke, all episodes (dummy video/audio)
        shell: bash
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./native/build/caves --smoke 120
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./native/build/caves_ep2 --smoke 120
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./native/build/caves_ep3 --smoke 120

      # The launcher picker (caves only) must render and respond to input:
      # the scripted Down+Enter lands on Episode 2 (all siblings are built).
      - name: Launcher picker smoke
        shell: bash
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            ./native/build/caves --menu-smoke | grep -q "MENU OK: selected 2 of 3"

      # Save isolation: all three episode variants write into one shared
      # directory and may only touch their own cc<N>.* files (each binary
      # asserts the others' bytes stayed identical).
      - name: Save-file isolation (per-episode namespaces)
        shell: bash
        run: |
          dir=$(mktemp -d)
          ./native/build/persist_test_ep1 "$dir"
          ./native/build/persist_test_ep2 "$dir"
          ./native/build/persist_test_ep3 "$dir"

      # Forgejo's fork of upload-artifact: the upstream v4 action refuses to
      # run against any server that is not github.com (GHESNotSupportedError).
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: caves-${{ matrix.os }}
          path: |
            native/build/caves
            native/build/caves.exe
            native/build/caves_ep2
            native/build/caves_ep2.exe
            native/build/caves_ep3
            native/build/caves_ep3.exe
          if-no-files-found: error

      # Tag builds: all three binaries as one per-OS bundle on the release.
      # cmake -E tar is used for the packaging because cmake is guaranteed
      # present on every leg of the matrix (and it handles zip on Windows).
      - name: Attach the binaries to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ github.ref_name }}"
          case "${{ matrix.os }}" in
            ubuntu*) out="caves-linux-$(uname -m)-$ver.tar.gz"; kind=tgz ;;
            macos*)  out="caves-macos-$(uname -m)-$ver.tar.gz"; kind=tgz ;;
            windows*) out="caves-windows-$(uname -m)-$ver.zip"; kind=zip ;;
            *)       out="caves-${{ matrix.os }}-$ver.tar.gz"; kind=tgz ;;
          esac
          cd native/build
          if [ "$kind" = zip ]; then
            cmake -E tar cf "../$out" --format=zip \
              caves.exe caves_ep2.exe caves_ep3.exe
          else
            cmake -E tar czf "../$out" caves caves_ep2 caves_ep3
          fi
          cd ../..
          # The archive was written to native/ by the cmake -E tar above.
          tools/upload_release_asset.sh "$ver" "native/$out" "$out"

  web-bundle:
    name: web bundle (all episodes)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest-amd64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"

      # The complete site: launch picker, game pages and all three episodes'
      # modules and asset packs — the same file set the production image
      # serves (see wasm/Makefile bundle-web).
      # NOTE: keep this a full-stream read (`wc -l`, not `head -5`): the
      # runner shell is bash -eo pipefail, so a pipe consumer that exits
      # early kills tar with SIGPIPE (exit 141) and fails the step.
      - name: Build and package the web bundle
        run: |
          make -C wasm bundle-web LLVM="$LLVM"
          test -s wasm/dist/crystal-caves-web.tar.gz
          echo "web bundle: $(tar -tzf wasm/dist/crystal-caves-web.tar.gz | wc -l) files"

      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: crystal-caves-web-${{ github.ref_name }}
          path: wasm/dist/crystal-caves-web.tar.gz
          if-no-files-found: error

      # Tag builds: the complete site (picker + all three episodes) as a
      # release asset next to the per-OS binary bundles.
      - name: Attach the web bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ github.ref_name }}"
          out="crystal-caves-web-$ver.tar.gz"
          cp wasm/dist/crystal-caves-web.tar.gz "$out"
          tools/upload_release_asset.sh "$ver" "$out" "$out"

  oracle:
    name: oracle regeneration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest-amd64
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          llvm_dir=$(dirname "$(readlink -f "$(command -v clang)")")
          echo "LLVM=$llvm_dir" >> "$GITHUB_ENV"

      - uses: https://data.forgejo.org/actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install oracle dependencies
        run: pip install -r tools/requirements.txt

      - name: Regenerate and compare oracle fixtures
        run: make -C wasm ${{ inputs.oracle_targets }} LLVM="$LLVM"
